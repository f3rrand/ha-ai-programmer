# HA AI Programmer — Home Assistant Add-on
name: "AI Programmer"
description: "Natural-language Home Assistant programmer powered by AI. Create automations, dashboards, blueprints, install HACS repos, and edit YAML configs — all through chat."
version: "1.0.2"
slug: "ai_programmer"
url: "https://github.com/f3rrand/ha-ai-programmer"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:robot"
panel_title: "AI Programmer"
map:
  - config:rw
  - addons:ro
  - share:rw
  - ssl:ro
homeassistant_api: true
auth_api: true
options:
  ai_provider: "gemini"
  gemini_api_key: ""
  gemini_model: "gemini-2.5-flash"
  openai_api_key: ""
  openai_model: "gpt-4o"
  anthropic_api_key: ""
  anthropic_model: "claude-sonnet-4-20250514"
  ollama_url: ""
  ollama_model: "llama3.1"
schema:
  ai_provider: "str"
  gemini_api_key: "str?"
  gemini_model: "str?"
  openai_api_key: "str?"
  openai_model: "str?"
  anthropic_api_key: "str?"
  anthropic_model: "str?"
  ollama_url: "str?"
  ollama_model: "str?"
